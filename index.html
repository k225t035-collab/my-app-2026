<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Master - Fantasy RPG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="level-up-modal" class="modal hidden">
        <div class="modal-content">
            <h2 class="animate-bounce">LEVEL UP!</h2>
            <p>新たな高みへ到達しました！</p>
            <button id="closeModal">続ける</button>
        </div>
    </div>

    <div class="app-container">
        <div class="status-bar">
            <div class="stat-item level-box">
                <span class="label">Lv.</span>
                <span id="userLevel" class="value">1</span>
            </div>
            <div class="xp-container">
                <div class="xp-bar-bg">
                    <div id="xpBar" class="xp-bar-fill"></div>
                </div>
                <div class="xp-text"><span id="currentXP">0</span> / <span id="nextLevelXP">100</span> XP</div>
            </div>
            <div class="stat-item gold-box">
                <span class="gold-icon">💰</span>
                <span id="userGold" class="value">0</span>
            </div>
        </div>

        <header>
            <h1>Quest Master</h1>
            <p class="subtitle">伝説のタスクを完遂せよ</p>
        </header>

        <section class="input-section">
            <input type="text" id="taskInput" placeholder="新たなクエストを刻む..." aria-label="クエスト名">
            <select id="prioritySelect" aria-label="難易度">
                <option value="low">初級 (10 XP)</option>
                <option value="medium" selected>中級 (20 XP)</option>
                <option value="high">上級 (50 XP)</option>
            </select>
            <button id="addTaskBtn">受注</button>
        </section>

        <section class="filter-section">
            <button class="filter-btn active" data-filter="all">全クエスト</button>
            <button class="filter-btn" data-filter="active">遂行中</button>
            <button class="filter-btn" data-filter="completed">完遂済み</button>
        </section>

        <ul id="taskList" class="task-list">
            <!-- クエストがここに追加されます -->
        </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
