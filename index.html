<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest Master - Fantasy RPG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- SVG Icon Sprite -->
    <svg style="display: none;">
        <symbol id="icon-sword" viewBox="0 0 24 24">
            <path fill="currentColor" d="M19.14 12.94L17.5 11.3l-1.42 1.41l1.64 1.64l-9.19 9.19L2 17.06l9.19-9.19l1.64 1.64l1.41-1.42l-1.64-1.64L14.24 4.8l1.41 1.41L21 2l-4.24 4.24l1.41 1.42l1.64-1.64l1.64 1.64l-2.31 2.31l1.64 1.64l.35-.35zM3.41 17.06l4.24 4.24l7.07-7.07l-4.24-4.24l-7.07 7.07z"/>
        </symbol>
        <symbol id="icon-shield" viewBox="0 0 24 24">
            <path fill="currentColor" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12c5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
        </symbol>
        <symbol id="icon-gold" viewBox="0 0 24 24">
            <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10s10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8s8 3.59 8 8s-3.59 8-8 8zm.31-8.86c-1.77-.45-2.34-.94-2.34-1.67c0-.84.79-1.39 2.1-1.39c1.31 0 1.96.59 2.12 1.38h1.43c-.17-1.4-.99-2.28-2.26-2.58V7h-2.53v1.89c-1.29.26-2.26.97-2.26 2.29c0 1.48.8 2.3 2.35 2.73c1.79.44 2.26 1.07 2.26 1.79c0 .72-.66 1.18-1.95 1.18c-1.5 0-2.12-.73-2.28-1.48h-1.54c.16 1.58 1.14 2.41 2.53 2.71V17h2.53v-1.89c1.29-.26 2.45-1.01 2.45-2.43c0-1.46-.72-2.3-2.3-2.68z"/>
        </symbol>
        <symbol id="icon-skull" viewBox="0 0 24 24">
            <path fill="currentColor" d="M12 2a9 9 0 0 0-9 9c0 2.17.76 4.15 2.04 5.71L3.3 21l3.29-1.71c.8.44 1.7.71 2.66.71c.21 0 .42-.02.63-.05l.33 2.05h3.58l.33-2.05c.21.03.42.05.63.05c.96 0 1.86-.27 2.66-.71L20.7 21l-1.74-4.29A8.974 8.974 0 0 0 21 11a9 9 0 0 0-9-9m-4 7a2 2 0 1 1 0 4a2 2 0 0 1 0-4m8 0a2 2 0 1 1 0 4a2 2 0 0 1 0-4m-6.5 7h5l-2.5 2.5l-2.5-2.5z"/>
        </symbol>
        <symbol id="icon-scroll" viewBox="0 0 24 24">
            <path fill="currentColor" d="M18 15h-2v2h2v-2m0-4h-2v2h2v-2m1-9H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 16H5V4h14v14z"/>
        </symbol>
        <symbol id="icon-volume-on" viewBox="0 0 24 24">
            <path fill="currentColor" d="M14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM3 9v6h4l5 5V4L7 9H3z"/>
        </symbol>
        <symbol id="icon-volume-off" viewBox="0 0 24 24">
            <path fill="currentColor" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27L7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21L21 19.73l-9-9L4.27 3zM12 4L9.91 6.09L12 8.18V4z"/>
        </symbol>
    </svg>

    <audio id="bgm" loop>
        <source src="https://noproblo.dayjo.org/ZeldaStep/ZeldaStep_BGM_Loop.mp3" type="audio/mpeg">
        <!-- Alternative free BGM if the above is unstable: https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3 -->
    </audio>

    <div id="level-up-modal" class="modal hidden">
        <div class="modal-content">
            <h2 class="animate-bounce">LEVEL UP!</h2>
            <p>新たな高みへ到達しました！</p>
            <button id="closeModal">続ける</button>
        </div>
    </div>

    <div class="app-container">
        <div class="status-bar">
            <div class="stat-item level-box">
                <svg class="icon"><use xlink:href="#icon-shield"></use></svg>
                <div class="level-info">
                    <span class="label">Lv.</span>
                    <span id="userLevel" class="value">1</span>
                </div>
            </div>
            <div class="xp-container">
                <div class="xp-bar-bg">
                    <div id="xpBar" class="xp-bar-fill"></div>
                </div>
                <div class="xp-text"><span id="currentXP">0</span> / <span id="nextLevelXP">100</span> XP</div>
            </div>
            <div class="stat-item controls-box">
                <div class="gold-box">
                    <svg class="icon gold-icon"><use xlink:href="#icon-gold"></use></svg>
                    <span id="userGold" class="value">0</span>
                </div>
                <button id="musicToggle" class="icon-btn" aria-label="音楽切り替え">
                    <svg class="icon"><use xlink:href="#icon-volume-off"></use></svg>
                </button>
            </div>
        </div>

        <header>
            <h1>Quest Master</h1>
            <p class="subtitle">伝説のタスクを完遂せよ</p>
        </header>

        <section class="input-section">
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="新たなクエストを刻む..." aria-label="クエスト名">
                <select id="prioritySelect" aria-label="難易度">
                    <option value="low">初級 (10 XP)</option>
                    <option value="medium" selected>中級 (20 XP)</option>
                    <option value="high">上級 (50 XP)</option>
                </select>
            </div>
            <button id="addTaskBtn">
                <svg class="icon"><use xlink:href="#icon-sword"></use></svg>
                <span>受注</span>
            </button>
        </section>

        <section class="filter-section">
            <button class="filter-btn active" data-filter="all">全クエスト</button>
            <button class="filter-btn" data-filter="active">遂行中</button>
            <button class="filter-btn" data-filter="completed">完遂済み</button>
        </section>

        <ul id="taskList" class="task-list">
            <!-- クエストがここに追加されます -->
        </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
